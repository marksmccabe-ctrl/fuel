<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#FAFAFA">
<title>fred · Strava</title>
<style>
/* fred v3 "soft minimal" (the same tokens as index.html, inline: this page is a separate file): #FAFAFA page, one white panel with a 1.5px
   grey outline, black primary button (50px, radius 16), outlined secondary button, secondary text #6E6E73, red ink only on warnings, no shadows */
:root{--page:#FAFAFA;--panel:#FFFFFF;--text:#0D0D0D;--text-body:#3A3A3C;--text-2:#6E6E73;--outline:#D2D2D7;--chip-line:#E5E5EA;--track:#F0F0F2;
  --brand:#179BCC;--black:#0D0D0D;--red-ink:#C21A2F;--link:#0B7399;--r-panel:20px;--r-btn:16px;--ol:1.5px;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;min-height:100vh;background:var(--page);color:var(--text);font:1rem/1.5 var(--font);display:flex;align-items:flex-start;justify-content:center;padding:48px 16px}
.card{width:100%;max-width:440px;background:var(--panel);border:var(--ol) solid var(--outline);border-radius:var(--r-panel);padding:24px 20px}
.apptile{display:inline-flex;align-items:center;justify-content:center;width:40px;height:40px;border-radius:11px;background:var(--brand);color:#fff;font:800 15px/1 var(--font);letter-spacing:-.02em;margin-bottom:16px}
h1{font:600 1.375rem/1.25 var(--font);font-size:min(1.375rem,10vw);overflow-wrap:anywhere;letter-spacing:-.01em;margin:0 0 8px;color:var(--text)}
p{margin:0 0 18px;color:var(--text-2);font-size:.9375rem}
p.warn{color:var(--red-ink)}
p.small{font-size:.8125rem;margin-top:-10px}
p.ver{margin:18px 0 0}
.btns{display:flex;flex-wrap:wrap;gap:10px}
a.btn{flex:1 1 auto;display:inline-flex;align-items:center;justify-content:center;min-height:50px;padding:0 20px;border-radius:var(--r-btn);background:var(--black);border:var(--ol) solid var(--black);color:#fff;font-weight:600;text-decoration:none;text-align:center}
a.btn.quiet{background:var(--panel);color:var(--text);border-color:var(--chip-line)}
a.btn:focus-visible{outline:2px solid var(--link);outline-offset:2px}
.spin{width:22px;height:22px;border-radius:50%;border:3px solid var(--track);border-top-color:var(--black);animation:s 1s linear infinite;margin-bottom:14px}
@keyframes s{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce){ .spin{animation:none} }
[hidden]{display:none!important}
</style>
</head>
<body>
<main class="card" id="card">
  <div class="apptile" aria-hidden="true">fred</div>
  <div class="spin" id="spin" aria-hidden="true"></div>
  <h1 id="title">Connecting Strava…</h1>
  <p id="text" role="status">One moment.</p>
  <p class="small" id="detail" hidden></p>
  <div class="btns" id="btns" hidden>
    <a class="btn" id="again" href="/?strava=retry" hidden>Try again</a>
    <a class="btn" id="back" href="/?strava=connected">Back to fred</a>
  </div>
  <p class="small ver" id="ver" hidden></p>
</main>
<script>
// Strava sends the browser here after "Authorize". This page hands {code, scope, state} to fred's Worker, which checks the one-time
// state it issued, trades the code for tokens and keeps them (they never reach this page). It works in any browser, even one that
// is not signed in to fred (an iPhone Home Screen app opens Strava in a separate browser): the state already says who asked.
(async function(){
  const $=id=>document.getElementById(id);
  const q=new URLSearchParams(location.search);
  const code=q.get('code')||'', scope=q.get('scope')||'', state=q.get('state')||'', error=q.get('error')||'';
  try{ history.replaceState(null, '', location.pathname); }catch(e){} // the code is single-use; keep it out of history anyway
  function show(title, text, {warn=false, again=null, back='/?strava=connected', backText='Back to fred'}={}){
    $('spin').hidden=true; $('title').textContent=title; $('text').textContent=text; $('text').className=warn?'warn':'';
    $('again').hidden=!again; if(again) $('again').href=again;
    $('back').href=back; $('back').textContent=backText; $('back').className=again?'btn quiet':'btn';
    $('btns').hidden=false; document.title='fred · '+title;
  }
  // No scope check here: the Worker trades the code first, then judges the scope from Strava's redirect and its token answer
  // (activity:read_all, or activity:read without private activities). "Try again" asks Strava to show the boxes again.
  const needScope=got=>{ show('Almost there', 'fred needs ‘View data about your activities’ to count your hours. Tap Try again and leave that box ticked.', {warn:true, again:'/?strava=retry', back:'/', backText:'Not now'});
    if(got!==undefined){ $('detail').textContent='Strava sent: '+(scope || '(no scope)')+' · fred’s server saw: '+(got===null ? '(nothing — an older copy of the server?)' : got || '(nothing)'); $('detail').hidden=false; } };
  if(error==='access_denied') return needScope();
  if(error || !code || !state) return show('That didn’t work', 'Strava didn’t send fred what it needs. Go back to fred and tap Connect with Strava again.', {warn:true, again:'/?strava=again', back:'/', backText:'Back to fred'});
  // the Worker's address is kept in one place: FRED_API_URL in fred's index.html
  let api=null;
  let want=null;
  try{ const t=await (await fetch('/index.html', {cache:'no-store'})).text(); const m=/const FRED_API_URL\s*=\s*(['"])(https:\/\/[^'"]+)\1/.exec(t); api=m?m[2].replace(/\/+$/,''):null;
    const w=/const FRED_WORKER_VERSION\s*=\s*'([0-9a-f]{4,40})'/.exec(t); want=w?w[1]:null; }catch(e){}
  if(!api) return show('Strava isn’t set up yet', 'fred’s Strava connection isn’t switched on yet.', {warn:true, back:'/', backText:'Back to fred'});
  // which code fred's server (the Cloudflare Worker) is running, in small grey text
  fetch(api+'/version', {cache:'no-store'}).then(r=>r.ok ? r.json() : null).catch(()=>undefined).then(v=>{ const el=$('ver');
    el.textContent = v===undefined ? 'fred server: not reachable' : !v || typeof v.version!=='string' ? 'fred server: an older copy (no version)'+(want ? ' · expected '+want : '')
      : 'fred server '+v.version+(v.builtAt ? ' · '+String(v.builtAt).slice(0,10) : '')+(want ? (v.version===want ? ' · up to date' : ' · expected '+want) : '');
    el.hidden=false; });
  let r, b={};
  try{ r=await fetch(api+'/strava/exchange', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({code, scope, state}), cache:'no-store'}); try{ b=await r.json(); }catch(e){} }
  catch(e){ return show('No connection', 'fred couldn’t reach its server. Check your connection, then try again.', {warn:true, again:'/?strava=again', back:'/', backText:'Back to fred'}); }
  if(r.ok && b.connected){
    const who=b.athleteName ? 'Strava is connected as '+b.athleteName+'. ' : 'Strava is connected. ';
    if(b.limited){ show('Connected', who+'fred can see your activities except private ones, because “View data about your private activities” wasn’t ticked. To count those too, tap Include private activities.', {again:'/?strava=private', back:'/?strava=connected'});
      $('again').textContent='Include private activities'; $('again').className='btn quiet'; $('back').className='btn'; return; }
    return show('Connected', who+'fred is syncing your activities.', {back:'/?strava=connected'}); }
  if(b.error==='scope') return needScope(typeof b.got==='string' ? b.got : null);
  if(b.error==='full') return show('Strava is full', 'fred’s Strava connection is full right now. Please try again another day.', {warn:true, back:'/?strava=full', backText:'Back to fred'});
  if(b.error==='state') return show('This link has expired', 'Go back to fred and tap Connect with Strava again.', {warn:true, again:'/?strava=again', back:'/', backText:'Back to fred'});
  show('That didn’t work', 'Something went wrong connecting Strava. Please try again.', {warn:true, again:'/?strava=again', back:'/', backText:'Back to fred'});
})();
</script>
</body>
</html>
