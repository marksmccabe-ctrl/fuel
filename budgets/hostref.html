<!doctype html>
<!-- budgets.test.mjs: the host reference. The kit's own fixed page, nothing from the app: a masked sky box of rain and snow and an SVG of
     40 bobbing shapes, all CSS loops (the kind of work item 87's skies and fred world's drawings do). Still until html.on, so it adds
     nothing to the host while a screen is measured. Its main-thread ms a frame at 6x rises with anything else that draws while it is
     read: the desktop, another browser, and the screen under test in the same browser (two FW.scene probes moving next to it: 1.69-1.84
     ms; stopped 1.15-1.23; taken out 1.14-1.35). So budgets.test.mjs holds the screen still while it reads this page (stillWhile: the
     screen's animations stopped), and then the reading is the host's: the frame windows are judged only next to a quiet reading
     (BUDGET.refMs). Do not change it without measuring it again. -->
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Budgets host reference</title>
<style>
body{margin:0;background:#fff;font:16px system-ui,sans-serif}
.box{position:relative;width:360px;height:176px;margin:16px;overflow:hidden;border-radius:16px;background:linear-gradient(#9cc4e4,#e8f1f8);-webkit-mask-image:linear-gradient(#000 55%,transparent);mask-image:linear-gradient(#000 55%,transparent)}
.box i{position:absolute;top:-20px;width:3px;height:14px;border-radius:2px;background:rgba(40,80,140,.6);animation:ref-fall 1.1s linear infinite}
.box b{position:absolute;top:-10px;width:8px;height:8px;border-radius:50%;background:#fff;animation:ref-snow 4s linear infinite}
svg{display:block;margin:0 16px}
svg g{animation:ref-bob 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.box i,.box b,svg g{animation-play-state:paused}
html.on .box i,html.on .box b,html.on svg g{animation-play-state:running}
@keyframes ref-fall{from{transform:translate(0,0) rotate(10deg)}to{transform:translate(-36px,210px) rotate(10deg)}}
@keyframes ref-snow{to{transform:translateY(200px)}}
@keyframes ref-bob{50%{transform:translateY(-6px) rotate(4deg)}}
</style></head><body>
<div class="box" id="sky"></div>
<svg id="art" width="360" height="200" viewBox="0 0 360 200" aria-hidden="true"></svg>
<script>
(function(){
  'use strict';
  var sky = document.getElementById('sky'), art = document.getElementById('art'), h = '', i;
  for (i = 0; i < 35; i++) h += '<i style="left:' + ((i * 37) % 380) + 'px;animation-delay:-' + ((i * 0.13) % 1.1).toFixed(2) + 's"></i>';
  for (i = 0; i < 60; i++) h += '<b style="left:' + ((i * 53) % 360) + 'px;animation-delay:-' + ((i * 0.29) % 4).toFixed(2) + 's"></b>';
  sky.innerHTML = h; h = '';
  for (i = 0; i < 40; i++) h += '<g style="animation-delay:-' + ((i * 0.17) % 2.4).toFixed(2) + 's"><circle cx="' + (12 + (i * 29) % 336) + '" cy="' + (20 + (i * 41) % 160) + '" r="9" fill="#e8a33a" stroke="#1a1a1a" stroke-width="2"/><path d="M' + (6 + (i * 29) % 336) + ' ' + (32 + (i * 41) % 160) + 'q6 6 12 0" fill="none" stroke="#1a1a1a" stroke-width="2"/></g>';
  art.innerHTML = h;
})();
</script>
</body></html>
