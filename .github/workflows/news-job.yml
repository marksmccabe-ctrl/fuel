# One News job (called by news-daily / news-weekend / news-results / news-pros). Build → validate → commit data/news.json only when valid and
# changed ("[skip ci]"). On failure the previous file stays and an issue is opened with the error.
# Times are US Eastern: each caller lists the UTC crons for summer (EDT) and winter (EST); this job runs only for the one that matches the
# current New York offset, so the time stays right across daylight saving. A manual run (workflow_dispatch) always runs.
name: news-job
on:
  workflow_call:
    inputs:
      job: {required: true, type: string}
      edt_crons: {required: false, type: string, default: ''}
      est_crons: {required: false, type: string, default: ''}
permissions:
  contents: write
  issues: write
  pages: write
concurrency:
  group: news-data
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Eastern time check
        id: when
        run: |
          S="${{ github.event.schedule }}"
          if [ -z "$S" ]; then echo "run=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          if [ "$(TZ=America/New_York date +%Z)" = "EDT" ]; then LIST="${{ inputs.edt_crons }}"; else LIST="${{ inputs.est_crons }}"; fi
          case "|$LIST|" in *"|$S|"*) echo "run=true" >> "$GITHUB_OUTPUT";; *) echo "run=false" >> "$GITHUB_OUTPUT"; echo "Not this one: $S is for the other half of the year.";; esac
      - uses: actions/checkout@v4
        if: steps.when.outputs.run == 'true'
        with: {ref: main}
      - uses: actions/setup-node@v4
        if: steps.when.outputs.run == 'true'
        with: {node-version: 22}
      - uses: actions/cache@v4
        if: steps.when.outputs.run == 'true'
        with:
          path: .news-cache
          key: news-cache-${{ github.run_id }}
          restore-keys: news-cache-
      - name: Build news.json (${{ inputs.job }})
        id: build
        if: steps.when.outputs.run == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          WT_API_KEY: ${{ secrets.WT_API_KEY }}
        run: node scripts/news/build.mjs "${{ inputs.job }}" 2>&1 | tee build.log; exit ${PIPESTATUS[0]}
      - name: Validate
        if: steps.when.outputs.run == 'true'
        run: node scripts/news/validate.mjs data/news.json
      - name: Not set yet (BLOCKED for Mark)
        if: steps.when.outputs.run == 'true' && steps.build.outputs.blocked != ''
        run: |
          {
            echo "### News runs with headlines and links only until these secrets are set"
            echo "- Missing: ${{ steps.build.outputs.blocked }}"
            echo "- WT_API_KEY: register at developers.triathlon.org → copy the API key → GitHub → fuel → Settings → Secrets and variables → Actions → New secret WT_API_KEY"
            echo "- ANTHROPIC_API_KEY: console.anthropic.com → API keys → Create key → GitHub → fuel → Settings → Secrets and variables → Actions → New secret ANTHROPIC_API_KEY"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Commit news.json
        if: steps.when.outputs.run == 'true' && steps.build.outputs.changed == 'true'
        run: |
          git config user.name "fred-news"
          git config user.email "fred-news@users.noreply.github.com"
          git add data/news.json
          git commit -m "news: ${{ inputs.job }} $(date -u +%Y-%m-%dT%H:%MZ) [skip ci]"
          for i in 1 2 3; do git pull --rebase origin main && git push origin HEAD:main && exit 0; sleep $((i*5)); done; exit 1
      - name: Publish (a "[skip ci]" commit does not start the Pages build by itself)
        if: steps.when.outputs.run == 'true' && steps.build.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds" >/dev/null || echo "Pages build request not accepted (Pages may deploy on its own)"
      - name: Open an issue (the previous news.json stays)
        if: failure() && steps.when.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          T="News job failed: ${{ inputs.job }}"
          B="The ${{ inputs.job }} job failed, so data/news.json was not changed (the app keeps showing the last good file).

          Error: ${{ steps.build.outputs.error }}

          Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

          \`\`\`
          $(tail -n 40 build.log 2>/dev/null)
          \`\`\`"
          N=$(gh issue list --state open --search "\"$T\" in:title" --json number --jq '.[0].number')
          if [ -n "$N" ]; then gh issue comment "$N" --body "$B"; else gh issue create --title "$T" --body "$B"; fi
