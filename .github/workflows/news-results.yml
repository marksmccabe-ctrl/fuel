# News results: Sunday 21:00 and Monday 6:00 US Eastern. Last weekend's results, standings, story lines.
name: news-results
on:
  schedule:
    - cron: '0 1 * * 1'
    - cron: '0 2 * * 1'
    - cron: '0 10 * * 1'
    - cron: '0 11 * * 1'
  workflow_dispatch: {}
permissions:
  contents: write
  issues: write
  pages: write
jobs:
  run:
    uses: ./.github/workflows/news-job.yml
    with:
      job: results
      edt_crons: '0 1 * * 1|0 10 * * 1'
      est_crons: '0 2 * * 1|0 11 * * 1'
    secrets: inherit
